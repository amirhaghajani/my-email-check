[project]
name = "mailagent"
version = "0.1.0"
description = "CLI agent that reads on-prem Exchange mail via EWS and acts through LLM-chosen tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arabic-reshaper>=3.0",
    "exchangelib>=5.4",
    "fastapi>=0.110",
    "llama-index-core>=0.12",
    "llama-index-llms-openai-like>=0.3",
    "mcp>=1.2",
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "python-bidi>=0.4",
    "python-dotenv>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mailagent = "mailagent.cli:main"
mailagent-web = "mailagent.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"