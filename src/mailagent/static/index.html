<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار ایمیل</title>
<style>
:root { --bg:#0f1117; --panel:#171a23; --user:#1f6feb; --agent:#2a2f3a; --text:#e6e6e6; --muted:#9aa4b2; }
* { box-sizing: border-box; }
body { margin:0; font-family: "Segoe UI", Vazirmatn, Tahoma, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid #262b36; flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; font-weight:600; }
header .info { color:var(--muted); font-size:12px; direction:ltr; }
header .spacer { flex:1; }
button { background:#2d333b; color:var(--text); border:1px solid #3a414d; border-radius:8px; padding:8px 12px; cursor:pointer; font-family:inherit; }
button:hover { background:#373e47; }
button:disabled { opacity:0.55; cursor:not-allowed; }
main { flex:1; display:flex; min-height:0; }
#chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width: min(760px, 80%); padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; line-height:1.6; }
.msg.user { background:var(--user); align-self:flex-start; border-bottom-right-radius:4px; }
.msg.agent { background:var(--agent); align-self:flex-end; border-bottom-left-radius:4px; }
.msg.error { background:#5a1f1f; }
.msg .meta { margin-top:6px; font-size:11px; color:var(--muted); direction:ltr; text-align:right; }
.waiting { opacity:0.9; color:var(--muted); font-style:italic; }
.dots { display:inline-flex; gap:4px; margin-left:6px; vertical-align:middle; }
.dots i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
#composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #262b36; background:var(--panel); }
#input { flex:1; resize:none; min-height:48px; max-height:160px; background:#0b0d12; color:var(--text); border:1px solid #2a2f3a; border-radius:10px; padding:10px 12px; font-family:inherit; font-size:15px; }
#composer button { background:var(--user); border-color:var(--user); min-width:90px; }
aside { width:400px; border-inline-start:1px solid #262b36; background:var(--panel); display:flex; flex-direction:column; min-height:0; }
.tabs { display:flex; border-bottom:1px solid #262b36; flex-wrap:wrap; }
.tabs button { flex:1 1 25%; border:0; border-radius:0; background:transparent; padding:10px 6px; font-size:12px; }
.tabs button.active { background:#0b0d12; color:#fff; }
.panel { flex:1; overflow:auto; padding:12px; display:none; }
.panel.active { display:block; }
#prompt { direction:ltr; text-align:left; font-family: Consolas, "Courier New", monospace; font-size:12px; white-space:pre-wrap; word-break:break-word; color:#cdd6e4; }
.draft { background:#0b0d12; border:1px solid #2a2f3a; border-radius:10px; padding:10px; margin-bottom:10px; }
.draft .meta { color:var(--muted); font-size:12px; margin-bottom:6px; }
.draft .body { white-space:pre-wrap; font-size:13px; margin-bottom:8px; }
.draft button { background:#238636; border-color:#238636; }
.field { margin-bottom:10px; }
.field label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
.field input, .field select, #search-q { width:100%; background:#0b0d12; color:var(--text); border:1px solid #2a2f3a; border-radius:8px; padding:8px; font-family:inherit; font-size:13px; }
.row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.row > input { flex:1; }
.row button { flex:0 0 auto; }
#crawl-start { background:#238636; border-color:#238636; }
#crawl-stop { background:#5a1f1f; border-color:#5a1f1f; }
.crawl-status { margin-top:10px; color:var(--muted); font-size:12px; direction:ltr; text-align:left; white-space:pre-wrap; }
.search-result { background:#0b0d12; border:1px solid #2a2f3a; border-radius:10px; padding:10px; margin-bottom:8px; }
.search-result .meta { color:var(--muted); font-size:11px; }
.search-result .subject { font-weight:600; margin:4px 0; }
.search-result .snippet { font-size:13px; color:#cdd6e4; white-space:pre-wrap; }
@media (max-width: 900px) {
  main { flex-direction:column; }
  aside { width:auto; height:45vh; border-inline-start:0; border-top:1px solid #262b36; }
}
</style>
</head>
<body>
<header>
  <h1>دستیار ایمیل</h1>
  <span class="info" id="info"></span>
  <span class="spacer"></span>
  <button id="reset">گفتگوی جدید</button>
</header>
<main>
  <section id="chat">
    <div id="messages"></div>
    <form id="composer">
      <textarea id="input" dir="auto" placeholder="پیام خود را بنویسید..."></textarea>
      <button type="submit" id="send-btn">ارسال</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button class="active" data-tab="prompt">Prompt LLM</button>
      <button data-tab="drafts">Drafts</button>
      <button data-tab="crawl">Crawl</button>
      <button data-tab="search">Search</button>
    </div>
    <div class="panel active" id="panel-prompt"><div id="prompt">—</div></div>
    <div class="panel" id="panel-drafts"><div id="drafts">—</div></div>
    <div class="panel" id="panel-crawl">
      <div class="field">
        <label for="crawl-until">Crawl until date</label>
        <input type="date" id="crawl-until">
      </div>
      <div class="field">
        <label for="crawl-folder">Folder</label>
        <select id="crawl-folder">
          <option value="all">All (sent + inbox)</option>
          <option value="sentitems">Sent Items</option>
          <option value="inbox">Inbox</option>
        </select>
      </div>
      <div class="row">
        <button id="crawl-start">Start crawl</button>
        <button id="crawl-stop">Stop</button>
      </div>
      <div class="crawl-status" id="crawl-status">idle</div>
    </div>
    <div class="panel" id="panel-search">
      <div class="row">
        <input type="text" id="search-q" dir="auto" placeholder="Search emails...">
        <button id="search-btn">Search</button>
      </div>
      <div id="search-results">—</div>
    </div>
  </aside>
</main>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const promptEl = document.getElementById('prompt');
const draftsEl = document.getElementById('drafts');

let pendingEl = null;
let waitTimer = null;

function addMsg(role, text, isError) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isError ? ' error' : '');
  div.setAttribute('dir', 'auto');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMsgWithMeta(role, text, elapsedMs, isError) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isError ? ' error' : '');
  div.setAttribute('dir', 'auto');
  const body = document.createElement('div');
  body.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = '⏱ ' + (elapsedMs / 1000).toFixed(1) + 's';
  div.append(body, meta);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setWaiting(on) {
  if (on) {
    if (pendingEl) return;
    pendingEl = document.createElement('div');
    pendingEl.className = 'msg agent waiting';
    pendingEl.setAttribute('dir', 'auto');
    pendingEl.innerHTML =
      '<span class="dots"><i></i><i></i><i></i></span> در حال پردازش... 0.0s';
    messagesEl.appendChild(pendingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    const started = performance.now();
    waitTimer = setInterval(() => {
      if (pendingEl) {
        const secs = ((performance.now() - started) / 1000).toFixed(1);
        pendingEl.innerHTML =
          '<span class="dots"><i></i><i></i><i></i></span> در حال پردازش... ' + secs + 's';
      }
    }, 100);
    inputEl.disabled = true;
    sendBtn.disabled = true;
  } else {
    clearInterval(waitTimer);
    waitTimer = null;
    if (pendingEl) { pendingEl.remove(); pendingEl = null; }
    inputEl.disabled = false;
    sendBtn.disabled = false;
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || pendingEl) return;
  addMsg('user', text);
  inputEl.value = '';
  setWaiting(true);
  const started = performance.now();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    const elapsed = (data.elapsed_ms != null) ? data.elapsed_ms : (performance.now() - started);
    setWaiting(false);
    addMsgWithMeta('agent', data.response || '(no response)', elapsed, false);
    renderPrompt(data.prompt);
  } catch (e) {
    const elapsed = performance.now() - started;
    setWaiting(false);
    addMsgWithMeta('agent', '[error] ' + e, elapsed, true);
  } finally {
    refreshDrafts();
  }
}

function renderPrompt(prompt) {
  if (!prompt) { promptEl.textContent = '—'; return; }
  promptEl.textContent = JSON.stringify(prompt, null, 2);
}

async function refreshPrompt() {
  try {
    const res = await fetch('/api/prompt');
    const data = await res.json();
    renderPrompt(data.latest);
  } catch (e) {}
}

async function refreshDrafts() {
  try {
    const res = await fetch('/api/drafts');
    const data = await res.json();
    draftsEl.innerHTML = '';
    const drafts = data.drafts || [];
    if (!drafts.length) { draftsEl.textContent = '—'; return; }
    for (const d of drafts) {
      const card = document.createElement('div');
      card.className = 'draft';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'To: ' + (d.to || []).join(', ') + ' — ' + d.subject;
      meta.setAttribute('dir', 'auto');
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = d.body || '';
      body.setAttribute('dir', 'auto');
      const btn = document.createElement('button');
      btn.textContent = 'ارسال / Send';
      btn.onclick = async () => {
        btn.disabled = true;
        await fetch('/api/drafts/' + d.draft_id + '/send', {method: 'POST'});
        refreshDrafts();
      };
      card.append(meta, body, btn);
      draftsEl.appendChild(card);
    }
  } catch (e) {}
}

async function reset() {
  await fetch('/api/reset', {method: 'POST'});
  messagesEl.innerHTML = '';
  pendingEl = null;
  addMsg('agent', 'گفتگوی جدید شروع شد.');
}

// --- crawl ---
async function startCrawl() {
  const until = document.getElementById('crawl-until').value;
  const folder = document.getElementById('crawl-folder').value;
  const el = document.getElementById('crawl-status');
  if (!until) { el.textContent = 'Select a date first.'; return; }
  const res = await fetch('/api/crawl', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({until, folder})
  });
  const data = await res.json();
  if (!data.started) { el.textContent = 'Error: ' + (data.error || 'could not start'); return; }
  refreshCrawlStatus();
}

async function stopCrawl() {
  await fetch('/api/crawl/stop', {method: 'POST'});
  refreshCrawlStatus();
}

async function refreshCrawlStatus() {
  try {
    const res = await fetch('/api/crawl/status');
    const s = await res.json();
    const el = document.getElementById('crawl-status');
    if (s.running) {
      el.textContent =
        'running — ' + s.processed + ' emails — ' + s.folder +
        ' — last: ' + (s.last_subject || '') + ' (' + (s.last_sent_at || '') + ')';
      setTimeout(refreshCrawlStatus, 1000);
    } else if (s.status === 'idle') {
      el.textContent = 'idle';
    } else {
      el.textContent =
        s.status + ' — ' + s.processed + ' emails' +
        (s.error ? ' — error: ' + s.error : '');
    }
  } catch (e) {}
}

// --- search ---
async function doSearch() {
  const q = document.getElementById('search-q').value.trim();
  if (!q) return;
  const res = await fetch('/api/search', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({q, limit: 10})
  });
  const data = await res.json();
  const el = document.getElementById('search-results');
  el.innerHTML = '';
  if (data.error) { el.textContent = 'Error: ' + data.error; return; }
  if (!data.results || !data.results.length) { el.textContent = 'No results'; return; }
  for (const r of data.results) {
    const card = document.createElement('div');
    card.className = 'search-result';
    card.setAttribute('dir', 'auto');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (r.sent_at || '') + ' — ' + (r.sender_name || '') + ' <' + (r.sender_email || '') + '>';
    const subject = document.createElement('div');
    subject.className = 'subject';
    subject.textContent = r.subject || '';
    const snippet = document.createElement('div');
    snippet.className = 'snippet';
    snippet.textContent = r.snippet || '';
    card.append(meta, subject, snippet);
    el.appendChild(card);
  }
}

document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); send(); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('reset').onclick = reset;
document.getElementById('crawl-start').onclick = startCrawl;
document.getElementById('crawl-stop').onclick = stopCrawl;
document.getElementById('search-btn').onclick = doSearch;
document.getElementById('search-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'crawl') refreshCrawlStatus();
  };
});

(async () => {
  try {
    const res = await fetch('/api/info');
    const info = await res.json();
    document.getElementById('info').textContent =
      info.model + ' · ' + info.backend + ' · ' + info.mailbox;
  } catch (e) {}
  refreshPrompt();
  refreshDrafts();
  refreshCrawlStatus();
  setInterval(refreshPrompt, 5000);
  setInterval(refreshDrafts, 5000);
})();
</script>
</body>
</html>
